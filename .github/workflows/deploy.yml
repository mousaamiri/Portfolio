name: Deploy to Plesk Host
on:
  push:
    branches: [ main ]
jobs:
  deploy-api:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Publish API
        run: dotnet publish src\Presentation\Portfolio.API\Portfolio.API.csproj -c Release -o ./publish-api -p:SatelliteResourceLanguages=en

      - name: Create app_offline.htm
        shell: pwsh
        run: |
          "Site is being updated, back shortly." | Out-File -FilePath ./publish-api/app_offline.htm -Encoding utf8

      - name: Deploy API via FTP
        uses: Wandalen/wretry.action@v3
        with:
          action: SamKirkland/FTP-Deploy-Action@v4.3.5
          attempt_limit: 3
          attempt_delay: 15000
          with: |
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME_API }}
            password: ${{ secrets.FTP_PASSWORD_API }}
            local-dir: ./publish-api/
            server-dir: /
            protocol: ftp
            security: loose
            timeout: 120000
            state-name: .ftp-deploy-sync-state-api.json
            exclude: |
              **/appsettings.Production.json

      - name: Remove app_offline.htm
        shell: pwsh
        run: |
          curl.exe --ftp-ssl -k -u "${{ secrets.FTP_USERNAME_API }}:${{ secrets.FTP_PASSWORD_API }}" -Q "-DELE app_offline.htm" "ftp://${{ secrets.FTP_SERVER }}/"

  deploy-web:
    needs: deploy-api
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Publish Web
        run: dotnet publish src\Presentation\Portfolio.Web\Portfolio.Web.csproj -c Release -o ./publish-web -p:SatelliteResourceLanguages=en

      - name: Create app_offline.htm
        shell: pwsh
        run: |
          "Site is being updated, back shortly." | Out-File -FilePath ./publish-web/app_offline.htm -Encoding utf8

      - name: Deploy Web via FTP
        uses: Wandalen/wretry.action@v3
        with:
          action: SamKirkland/FTP-Deploy-Action@v4.3.5
          attempt_limit: 3
          attempt_delay: 15000
          with: |
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME_WEB }}
            password: ${{ secrets.FTP_PASSWORD_WEB }}
            local-dir: ./publish-web/
            server-dir: /
            protocol: ftp
            security: loose
            timeout: 120000
            state-name: .ftp-deploy-sync-state-web.json
            exclude: |
              **/appsettings.Production.json

      - name: Remove app_offline.htm
        shell: pwsh
        run: |
          curl.exe --ftp-ssl -k -u "${{ secrets.FTP_USERNAME_WEB }}:${{ secrets.FTP_PASSWORD_WEB }}" -Q "-DELE app_offline.htm" "ftp://${{ secrets.FTP_SERVER }}/"
